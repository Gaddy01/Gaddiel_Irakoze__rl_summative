[project]
name = "gaddiel-irakoze-rl-summative"
version = "0.1.0"
description = "Synthetic mission-based industrial investment reinforcement learning simulator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=1.4.0",
    "numpy>=2.4.6",
    "tensordict>=0.15.6",
    "torch>=2.15.0",
    "torchrl>=0.15.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "pytest>=9.2.0",
    "scipy>=1.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
